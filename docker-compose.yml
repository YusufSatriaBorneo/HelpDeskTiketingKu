services:
  postgres:
    image: postgres:17
    container_name: helpdesk-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: helpdesk
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: helpdesk-backend
    ports:
      - "5000:5000"
    depends_on:
      - postgres
    env_file:
      - ./backend/.env
    # 1. TAMBAHAN: Akses ke n8n di Localhost Komputer
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # 2. TAMBAHAN: Penyimpanan Permanen Gambar Upload
    volumes:
      - ./backend/uploads:/app/uploads

  frontend:
    build: ./frontend
    container_name: helpdesk-frontend
    ports:
      - "3000:5173"
    depends_on:
      - backend

  # --------------------------------------------------
  # TAMBAHAN BARU: Web UI Adminer untuk Kelola Database
  # --------------------------------------------------
  adminer:
    image: adminer
    container_name: helpdesk-adminer
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  postgres-data: