services:
  postgres:
    image: postgres:17

    container_name: helpdesk-postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: helpdesk

    ports:
      - "5433:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

  backend:
    build: ./backend

    container_name: helpdesk-backend

    ports:
      - "5000:5000"

    depends_on:
      - postgres

    env_file:
      - ./backend/.env

  frontend:
    build: ./frontend

    container_name: helpdesk-frontend

    ports:
      - "3000:5173"

    depends_on:
      - backend

volumes:
  postgres-data:
